name: Android WebView Build

on:
  workflow_dispatch:
    inputs:
      buildId:
        description: 'Build ID'
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      BUILD_ID: ${{ inputs.buildId }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}

    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4
        with:
          ref: debugbuilder/build-${{ inputs.buildId }}
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Install backend deps
        run: npm install --omit=dev

      - name: Fetch build data
        run: node scripts/report.js "Project Validation" 5 "Fetching project files"

      - name: Extract project
        run: node scripts/fetch-build.js

      - name: Prepare Android project
        run: node scripts/report.js "Android Configuration" 25 "Preparing Android project"

      - name: Run prepare script
        run: node scripts/prepare-android.js

      - name: Gradle Build
        run: node scripts/report.js "Gradle Build" 50 "Running Gradle"

      - name: Build APK/AAB
        run: |
          set -e
          set -o pipefail  # Ye line Gradle ka asli error pakadne ke liye hai
          cd build-workspace
          BUILD_TYPE=$(node -e "console.log(require('./build-meta.json').buildType)")
          VARIANT=$(node -e "console.log(require('./build-meta.json').variant)")
          echo "Building $BUILD_TYPE ($VARIANT)"
          if [ "$BUILD_TYPE" = "AAB" ]; then
            gradle bundleRelease --no-daemon --stacktrace 2>&1 | tee gradle-log.txt
          elif [ "$VARIANT" = "release" ]; then
            gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee gradle-log.txt
          else
            gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle-log.txt
          fi

      - name: Locate Artifact
        id: locate_artifact
        run: |
          cd build-workspace
          BUILD_TYPE=$(node -e "console.log(require('./build-meta.json').buildType)")
          if [ "$BUILD_TYPE" = "AAB" ]; then
            FILE=$(find app/build/outputs/bundle -name "*.aab" | head -n 1)
          else
            FILE=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          fi
          if [ -z "$FILE" ]; then
            echo "Error: Could not find the built artifact!"
            exit 1
          fi
          echo "Artifact found: $FILE"
          echo "artifact_path=$FILE" >> $GITHUB_OUTPUT

      - name: Upload artifact
        run: node scripts/report.js "APK/AAB Generation" 80 "Uploading artifact to GitHub Release"

      - name: Upload release and finalize state
        run: node scripts/upload-release.js
        env:
          ARTIFACT_PATH: build-workspace/${{ steps.locate_artifact.outputs.artifact_path }}

      - name: On failure report error
        if: failure()
        run: node scripts/report.js --fail "Failed" "Workflow step failed"
